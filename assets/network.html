<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>{% include 'lib/vis-9.1.2/vis-network.css' %}</style>
  <script>{% include 'lib/vis-9.1.2/vis-network.min.js' %}</script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #network { width: 100%; height: 430px; background: #f8faf9; }
    .vis-network:focus { outline: 2px solid #187569; outline-offset: -2px; }
    .vis-navigation .vis-button { filter: grayscale(1); opacity: .7; }
    .vis-navigation .vis-button:hover, .vis-navigation .vis-button:focus { opacity: 1; box-shadow: 0 0 0 2px #187569; }
    div.vis-tooltip { font-size: 12px; color: #202b2b; background: white; border: 1px solid #dce3e2; border-radius: 4px; padding: 8px; white-space: normal; max-width: 260px; }
  </style>
</head>
<body>
  <div id="network" role="img" aria-label="Направленный граф переводов выбранного клиента"></div>
  <script>
    const container = document.getElementById('network');
    const nodes = new vis.DataSet({{ nodes | tojson }});
    const edges = new vis.DataSet({{ edges | tojson }});
    const network = new vis.Network(container, {nodes, edges}, {{ options | safe }});
    network.once('stabilizationIterationsDone', () => {
      network.setOptions({physics: {enabled: false}});
      network.fit({animation: false});
    });
    let lastWidth = 0;
    new ResizeObserver(entries => {
      const width = entries[0].contentRect.width;
      if (width > 0 && Math.abs(width - lastWidth) > 8) {
        lastWidth = width;
        network.redraw();
        network.fit({animation: false});
      }
    }).observe(container);
    const labels = {up: 'Сдвинуть вверх', down: 'Сдвинуть вниз', left: 'Сдвинуть влево', right: 'Сдвинуть вправо', zoomIn: 'Приблизить', zoomOut: 'Отдалить', zoomExtends: 'Показать весь граф'};
    Object.entries(labels).forEach(([name, label]) => {
      const button = container.querySelector('.vis-' + name);
      if (!button) return;
      button.title = label;
      button.setAttribute('aria-label', label);
      button.setAttribute('role', 'button');
      button.tabIndex = 0;
      button.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          button.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
          setTimeout(() => document.dispatchEvent(new MouseEvent('mouseup', {bubbles: true})), 120);
        }
      });
    });
  </script>
</body>
</html>
